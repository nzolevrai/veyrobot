name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veyrobot
          POSTGRES_PASSWORD: veyrobot_local
          POSTGRES_DB: veyrobot
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U veyrobot -d veyrobot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://veyrobot:veyrobot_local@localhost:5432/veyrobot?schema=public
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://veyrobot:veyrobot_local@localhost:5432/veyrobot?schema=public
      - run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://veyrobot:veyrobot_local@localhost:5432/veyrobot?schema=public
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://veyrobot:veyrobot_local@localhost:5432/veyrobot?schema=public
      - run: pnpm lint
        env:
          DATABASE_URL: postgresql://veyrobot:veyrobot_local@localhost:5432/veyrobot?schema=public
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://veyrobot:veyrobot_local@localhost:5432/veyrobot?schema=public
          RUN_POSTGRES_INTEGRATION: '1'
          RUN_DASHBOARD_ROUTE_INTEGRATION: '1'
